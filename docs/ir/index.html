<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abriendo Hu-Manos Colombia...</title>
<style>
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #F5F2FA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #d9d0f0;
    border-top-color: #4311B9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { color: #4311B9; font-size: 20px; margin-bottom: 8px; }
  p { color: #444; font-size: 15px; max-width: 320px; }
  #fallback { display: none; margin-top: 24px; }
  .btn {
    display: inline-block;
    background: #4311B9;
    color: white;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1>Abriendo Hu-Manos Colombia...</h1>
  <p id="message">Si la app ya está instalada, se abrirá automáticamente en un momento.</p>

  <div id="fallback">
    <p>Parece que aún no tienes la app instalada, o no se pudo abrir automáticamente.</p>
    <a class="btn" id="downloadLink" href="#">📲 Descargar la app</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  const APK_DOWNLOAD_URL = "https://expo.dev/accounts/andrestebanpatino/projects/hu-manos-colombia/builds/7e1035ba-e194-4371-8aeb-7e33e4011e5c";

  document.getElementById('downloadLink').href = APK_DOWNLOAD_URL;

  if (id) {
    const deepLink = `humanocolombia://detail/${id}`;
    window.location = deepLink;
  }

  setTimeout(function () {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('message').style.display = 'none';
    document.getElementById('fallback').style.display = 'block';
  }, 1500);
</script>
</body>
</html>
